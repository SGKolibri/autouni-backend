services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: autoUniMqtt
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - autouni-network
    command: mosquitto -c /mosquitto-no-auth.conf

  db:
    image: postgres:16-alpine
    container_name: autoUniDb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autounidockeradmin
      POSTGRES_DB: autounidb
    ports:
      - '5432:5432' # opcional, só p/ acessar do host
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d autounidb']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autouni-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoUniApi
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Para desenvolvimento, use o banco local ou remoto conforme .env
      DATABASE_URL: postgresql://postgres:autounidockeradmin@db:5432/autounidb?schema=public
      # MQTT dentro do container usa o hostname do serviço (mqtt)
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      ROOT_EMAIL: ${ROOT_EMAIL}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    networks:
      - autouni-network

volumes:
  mqtt-data:
  mqtt-logs:
  db-data:

networks:
  autouni-network:
    driver: bridge
