services:
  mqtt:
    # Versão fixa: o caminho do plugin dynamic-security faz parte do contrato.
    image: eclipse-mosquitto:2.0.20
    container_name: autoUniMqtt
    restart: unless-stopped
    ports:
      - '1883:1883'
    environment:
      # Só usados na primeira subida, para criar o administrador do broker.
      MQTT_ADMIN_USERNAME: ${MQTT_USERNAME:?defina MQTT_USERNAME no .env}
      MQTT_ADMIN_PASSWORD: ${MQTT_PASSWORD:?defina MQTT_PASSWORD no .env}
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto/init.sh:/mosquitto/init.sh:ro,z
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - autouni-network
    entrypoint: ['/bin/sh', '/mosquitto/init.sh']

  db:
    image: postgres:16-alpine
    container_name: autoUniDb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autounidockeradmin
      POSTGRES_DB: autounidb
    ports:
      - '5432:5432' # opcional, só p/ acessar do host
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d autounidb']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autouni-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoUniApi
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Para desenvolvimento, use o banco local ou remoto conforme .env
      DATABASE_URL: postgresql://postgres:autounidockeradmin@db:5432/autounidb?schema=public
      # MQTT dentro do container usa o hostname do serviço (mqtt)
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # Endereço que os ESP32 usam (vai na resposta de POST /nodes).
      MQTT_PUBLIC_URL: ${MQTT_PUBLIC_URL:-}
      # Porta interna fixa da API no container
      PORT: 3000
      # URL pública (porta do host) usada pelo Swagger e links de e-mail
      APP_URL: ${APP_URL:-http://localhost:10000}
      JWT_SECRET: ${JWT_SECRET}
      ROOT_EMAIL: ${ROOT_EMAIL}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - autouni-network

volumes:
  postgres-data:
  mqtt-data:
  mqtt-logs:
  db-data:

networks:
  autouni-network:
    driver: bridge
