# Broker do AutoUni: sem acesso anônimo. Usuários, senhas e ACLs vivem no
# plugin dynamic-security (/mosquitto/data/dynamic-security.json) e são
# geridos pelo backend: cada nó ESP32 recebe credencial própria e só publica
# nos tópicos dos devices dele.
per_listener_settings false
allow_anonymous false

listener 1883

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
